<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ant Splat!</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  #map { width: 100vw; height: 100vh; cursor: none; }

  #paintball-gun {
    position: fixed; z-index: 999; pointer-events: none;
    transform: translate(-10px, -10px);
    transition: transform 0.03s linear;
  }
  #paintball-gun.firing {
    animation: gunRecoil 0.15s ease-out;
  }
  #muzzle-flash {
    position: fixed; z-index: 998; pointer-events: none;
    opacity: 0; transition: opacity 0.05s;
  }
  #muzzle-flash.show { opacity: 1; }
  @keyframes gunRecoil {
    0% { transform: translate(-10px, -10px) rotate(0deg); }
    30% { transform: translate(-10px, -4px) rotate(-8deg); }
    100% { transform: translate(-10px, -10px) rotate(0deg); }
  }

  /* Sunset wash over the map */
  #map::after {
    content: '';
    position: fixed; inset: 0; z-index: 399;
    pointer-events: none;
    background: linear-gradient(
      180deg,
      rgba(255, 120, 50, 0.25) 0%,
      rgba(255, 80, 80, 0.18) 30%,
      rgba(180, 60, 100, 0.15) 55%,
      rgba(80, 40, 100, 0.2) 80%,
      rgba(30, 20, 60, 0.3) 100%
    );
    mix-blend-mode: multiply;
  }

  /* Sidewalk crack lines */
  #crack-overlay {
    position: fixed; inset: 0; z-index: 398;
    pointer-events: none;
    opacity: 0.08;
    background-image:
      linear-gradient(0deg, transparent 49.5%, #a07050 49.5%, #a07050 50.5%, transparent 50.5%),
      linear-gradient(90deg, transparent 49.5%, #a07050 49.5%, #a07050 50.5%, transparent 50.5%);
    background-size: 280px 280px;
  }

  #hud {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 12px; align-items: center;
  }
  .hud-pill {
    background: rgba(80,70,60,0.85); color: #f5f0e8; padding: 8px 16px;
    border-radius: 24px; font-size: 15px; font-weight: 600;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    white-space: nowrap; border: 1px solid rgba(0,0,0,0.15);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .hud-pill .label { opacity: 0.6; font-weight: 400; margin-right: 4px; }

  #color-picker {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 8px; background: rgba(80,70,60,0.85);
    padding: 8px 12px; border-radius: 24px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(0,0,0,0.15);
  }
  .color-swatch {
    width: 32px; height: 32px; border-radius: 50%; cursor: none;
    border: 3px solid transparent; transition: border-color 0.15s, transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #f5f0e8; transform: scale(1.15); }

  #streak-popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 1001; font-size: 48px; font-weight: 900; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5); pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #streak-popup.show { opacity: 1; }

  .splat-marker { pointer-events: none; transition: opacity 2s ease 8s; }
  .splat-marker.fading { opacity: 0; }

  .ant-tooltip {
    background: rgba(60,50,40,0.9) !important; color: #f5f0e8 !important;
    border: none !important; border-radius: 8px !important;
    padding: 4px 8px !important; font-size: 12px !important;
    font-weight: 600 !important; font-style: italic !important;
  }
  .ant-tooltip::before { display: none !important; }

  .leaflet-control-attribution { display: none !important; }

  /* Sunset golden hour tint on map tiles */
  .leaflet-tile-pane { filter: saturate(0.35) brightness(1.05) sepia(0.5) hue-rotate(-10deg) contrast(0.9); }

  /* Timer */
  #timer {
    position: fixed; top: 12px; right: 28px; z-index: 1000;
    font-size: 160px; font-weight: 900; font-style: italic; color: #f5f0e8;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 60px rgba(255,140,0,0.15);
    line-height: 1; opacity: 0.85;
    transition: color 0.3s, transform 0.15s;
  }
  #timer.urgent { color: #FF3B5C; animation: timerPulse 0.5s infinite; }
  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* ── Shared overlay base ── */
  .game-overlay {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; cursor: default;
    background: radial-gradient(ellipse at 50% 40%, rgba(50,35,20,0.95), rgba(10,8,5,0.98));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .game-overlay.hidden { display: none !important; }

  /* Animated sidewalk cracks in the background */
  .overlay-cracks {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
    background-image:
      linear-gradient(0deg, transparent 49.5%, #aaa 49.5%, #aaa 50.5%, transparent 50.5%),
      linear-gradient(90deg, transparent 49.5%, #aaa 49.5%, #aaa 50.5%, transparent 50.5%);
    background-size: 200px 200px;
  }

  /* Floating splat decorations */
  .overlay-splat {
    position: absolute; border-radius: 50%; opacity: 0.08;
    animation: floatSplat 6s ease-in-out infinite alternate;
  }
  @keyframes floatSplat {
    0% { transform: translateY(0) scale(1) rotate(0deg); }
    100% { transform: translateY(-20px) scale(1.1) rotate(15deg); }
  }

  /* ── Start screen ── */
  #start-overlay { display: flex; }
  #start-card {
    text-align: center; color: #f5f0e8; position: relative; z-index: 1;
    animation: heroIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes heroIn {
    0% { transform: scale(0.5) translateY(60px); opacity: 0; filter: blur(8px); }
    100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
  }
  #start-card .hero-title {
    font-size: 80px; font-weight: 900; margin: 0;
    line-height: 0.95; letter-spacing: -2px;
    background: linear-gradient(180deg, #FFD600 0%, #FF8C00 50%, #CC2200 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 4px 20px rgba(255,140,0,0.4));
  }
  #start-card .hero-ant {
    font-size: 100px; display: block; margin: 16px 0 8px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
    animation: antBob 2s ease-in-out infinite;
  }
  @keyframes antBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }
  #start-card .hero-sub {
    font-size: 18px; opacity: 0.45; margin: 0 0 40px;
    font-weight: 400; letter-spacing: 1px; text-transform: uppercase;
  }
  #start-btn {
    padding: 18px 56px; font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, #FF8C00, #CC2200);
    color: #fff; border: none; border-radius: 20px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
    box-shadow: 0 4px 24px rgba(255,100,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #start-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 32px rgba(255,100,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #start-btn:active { transform: scale(0.97); }

  /* ── Results screen ── */
  #results-overlay { display: none; }
  #results-overlay.show-flex { display: flex; }
  #results-card {
    position: relative; z-index: 1;
    background: linear-gradient(160deg, rgba(80,60,40,0.9), rgba(30,20,10,0.95));
    border-radius: 28px; padding: 48px 52px; text-align: center; color: #f5f0e8;
    border: 1px solid rgba(255,200,100,0.12);
    max-width: 440px; width: 90%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 80px rgba(255,140,0,0.08);
    animation: resultsSlam 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes resultsSlam {
    0% { transform: scale(1.8) translateY(-40px); opacity: 0; filter: blur(12px); }
    60% { transform: scale(0.95) translateY(4px); opacity: 1; filter: blur(0); }
    100% { transform: scale(1) translateY(0); }
  }
  #results-card .results-title {
    font-size: 44px; margin: 0 0 4px; font-weight: 900;
    background: linear-gradient(180deg, #FFD600, #FF8C00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #results-card .results-sub {
    font-size: 14px; opacity: 0.4; margin-bottom: 28px;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .results-score-hero {
    font-size: 72px; font-weight: 900; margin: 8px 0 24px;
    background: linear-gradient(180deg, #FFD600 0%, #FF8C00 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 12px rgba(255,200,0,0.3));
    animation: scorePop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }
  @keyframes scorePop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .results-score-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 3px;
    opacity: 0.4; margin-bottom: 0;
  }
  .results-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
    margin: 24px 0 32px;
  }
  .stat-box {
    background: rgba(255,255,255,0.04); border-radius: 14px; padding: 16px 8px;
    animation: statIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .stat-box:nth-child(1) { animation-delay: 0.4s; }
  .stat-box:nth-child(2) { animation-delay: 0.5s; }
  .stat-box:nth-child(3) { animation-delay: 0.6s; }
  @keyframes statIn {
    0% { transform: translateY(20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .stat-value {
    font-size: 28px; font-weight: 800; color: #f5f0e8;
    line-height: 1.1;
  }
  .stat-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    opacity: 0.4; margin-top: 4px;
  }
  .results-rank {
    font-size: 14px; opacity: 0.5; margin-bottom: 24px;
    font-style: italic;
  }
  #play-again {
    padding: 16px 48px; font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #FF8C00, #CC2200);
    color: #fff; border: none; border-radius: 18px;
    cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
    box-shadow: 0 4px 24px rgba(255,100,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: statIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
  }
  #play-again:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 32px rgba(255,100,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #play-again:active { transform: scale(0.97); }
</style>
</head>
<body>

<!-- Start screen -->
<div id="start-overlay" class="game-overlay">
  <div class="overlay-cracks"></div>
  <div class="overlay-splat" style="width:180px;height:180px;background:#FF8C00;top:10%;left:8%;animation-delay:-1s;"></div>
  <div class="overlay-splat" style="width:120px;height:120px;background:#CC2200;top:65%;right:10%;animation-delay:-3s;"></div>
  <div class="overlay-splat" style="width:90px;height:90px;background:#FFD600;bottom:15%;left:15%;animation-delay:-5s;"></div>
  <div id="start-card">
    <span class="hero-ant">
      <svg width="100" height="68" viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#f5f0e8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8">
          <path d="M32,16 Q38,8 40,4"/><path d="M32,16 Q38,24 40,28"/>
          <path d="M24,16 Q30,6 33,3"/><path d="M24,16 Q30,26 33,29"/>
          <path d="M16,16 Q20,7 24,5"/><path d="M16,16 Q20,25 24,27"/>
        </g>
        <ellipse cx="36" cy="16" rx="9" ry="6.5" fill="#f5f0e8" opacity="0.9"/>
        <ellipse cx="26" cy="16" rx="2.5" ry="3" fill="#f5f0e8" opacity="0.8"/>
        <ellipse cx="20" cy="16" rx="6" ry="5" fill="#f5f0e8" opacity="0.85"/>
        <ellipse cx="11" cy="16" rx="5.5" ry="5" fill="#f5f0e8" opacity="0.9"/>
        <ellipse cx="8.5" cy="13.5" rx="1.5" ry="1.3" fill="#FF8C00"/>
        <ellipse cx="8.5" cy="18.5" rx="1.5" ry="1.3" fill="#FF8C00"/>
        <path d="M6,14 Q3,12 2,14" stroke="#f5f0e8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M6,18 Q3,20 2,18" stroke="#f5f0e8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M9,12 Q6,6 2,4" stroke="#f5f0e8" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.6"/>

      </svg>

    <h1 class="hero-title">Ant Splat!</h1>

<!-- Results screen -->
<div id="results-overlay" class="game-overlay" style="display:none;">
  <div class="overlay-cracks"></div>
  <div id="results-card">
    <div class="results-title">Time's Up!</div>
    <div class="results-sub">Damage Report</div>
    <div class="results-score-label">Final Score</div>

      <div class="stat-box">

</div>

<div id="hud" style="display:none;">

  <div class="hud-pill"><span class="label">Streak</span><span id="streak">0</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Config ──
const API_URL = 'https://valley-metro-proxy.ccarse.workers.dev/';
const REFRESH_MS = 4000;

const PAINT_COLORS = [
  '#CC2200', '#FF3B5C', '#FF8C00', '#FFD600',
  '#00E676', '#00B0FF', '#AA00FF', '#FF69B4'
];

// ── Sound Engine (Web Audio API, no files needed) ──
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Ensure audio context is resumed on first interaction
document.addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function playNoise(duration, volume, filterFreq) {
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq || 800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  source.connect(filter).connect(gain).connect(audioCtx.destination);
  source.start();
}

function playTone(freq, duration, type, volume, slide) {
  const osc = audioCtx.createOscillator();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + duration);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sndShoot() {
  // Punchy paintball pop: short noise burst + thump
  playNoise(0.08, 0.4, 2000);
  playTone(150, 0.1, 'sine', 0.5, 60);
  // Compressed air hiss
  setTimeout(() => playNoise(0.12, 0.15, 4000), 30);
}

function sndSplat() {
  // Wet squish: filtered noise + descending tone
  playNoise(0.2, 0.5, 1200);
  playTone(400, 0.15, 'sawtooth', 0.15, 80);
  // Crunch
  setTimeout(() => playNoise(0.06, 0.3, 3000), 50);
}

function sndStreak(n) {
  playTone(500, 0.12, 'square', 0.2, 750);
  setTimeout(() => playTone(650, 0.15, 'square', 0.2, 1000), 80);
  setTimeout(() => playTone(800, 0.25, 'sine', 0.25, 1200), 160);
}

function sndQueen() {
  // Big bass boom for queen kills
  playTone(80, 0.3, 'sine', 0.6, 30);
  playNoise(0.25, 0.4, 600);
  setTimeout(() => playTone(200, 0.15, 'triangle', 0.2, 100), 100);
}

// ── Paintball gun SVG ──
function gunSVG(color) {
  return `<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <!-- Barrel -->
    <rect x="4" y="20" width="40" height="10" rx="3" fill="#444" stroke="#333" stroke-width="1"/>
    <!-- Barrel bore -->
    <circle cx="6" cy="25" r="3" fill="#222"/>
    <!-- Barrel highlight -->
    <rect x="8" y="21" width="32" height="3" rx="1.5" fill="#555" opacity="0.5"/>

    <!-- Hopper (paint ball container on top) -->
    <ellipse cx="32" cy="14" rx="10" ry="10" fill="${color}" opacity="0.85"/>
    <ellipse cx="32" cy="14" rx="10" ry="10" fill="url(#hopperShine)" opacity="0.6"/>
    <ellipse cx="32" cy="14" rx="10" ry="10" stroke="#333" stroke-width="1" fill="none"/>
    <!-- Paint balls visible inside -->
    <circle cx="28" cy="12" r="3" fill="${color}" opacity="0.6" stroke="#333" stroke-width="0.3"/>
    <circle cx="34" cy="10" r="2.5" fill="${color}" opacity="0.5" stroke="#333" stroke-width="0.3"/>
    <circle cx="31" cy="17" r="2.5" fill="${color}" opacity="0.5" stroke="#333" stroke-width="0.3"/>
    <!-- Hopper neck -->
    <rect x="28" y="22" width="8" height="4" rx="1" fill="#555" stroke="#333" stroke-width="0.5"/>

    <!-- Body/receiver -->
    <rect x="30" y="26" width="24" height="14" rx="4" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="32" y="28" width="18" height="4" rx="2" fill="#4a4a4a" opacity="0.5"/>

    <!-- Trigger guard -->
    <path d="M40,40 Q40,50 46,50 Q52,50 52,40" stroke="#333" stroke-width="2" fill="none"/>
    <!-- Trigger -->
    <rect x="44" y="41" width="3" height="7" rx="1" fill="#555"/>

    <!-- Grip -->
    <rect x="46" y="38" width="12" height="22" rx="4" fill="#2a2a2a" stroke="#222" stroke-width="1"/>
    <!-- Grip texture -->
    <line x1="48" y1="42" x2="56" y2="42" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="48" y1="45" x2="56" y2="45" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="48" y1="48" x2="56" y2="48" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="48" y1="51" x2="56" y2="51" stroke="#3a3a3a" stroke-width="0.8"/>
    <!-- Grip highlight -->
    <rect x="47" y="39" width="3" height="18" rx="1.5" fill="#3a3a3a" opacity="0.4"/>

    <!-- Tank (bottom, behind grip) -->
    <ellipse cx="52" cy="64" rx="6" ry="6" fill="#555" stroke="#444" stroke-width="1"/>
    <ellipse cx="52" cy="64" rx="6" ry="6" fill="url(#tankShine)" opacity="0.3"/>

    <!-- Sight / crosshair dot on barrel tip -->
    <circle cx="6" cy="25" r="1.5" fill="${color}" opacity="0.8"/>

    <defs>
      <radialGradient id="hopperShine" cx="35%" cy="30%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <radialGradient id="tankShine" cx="40%" cy="30%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    </defs>
  </svg>`;
}

function muzzleFlashSVG(color) {
  return `<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="12" fill="${color}" opacity="0.6"/>
    <circle cx="20" cy="20" r="6" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="20" r="3" fill="#fff"/>
  </svg>`;
}

// ── Gun cursor tracking ──
const gunEl = document.getElementById('paintball-gun');
const flashEl = document.getElementById('muzzle-flash');
let mouseX = 0, mouseY = 0;

function updateGun() {
  gunEl.innerHTML = gunSVG(selectedColor);
}

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  gunEl.style.left = mouseX + 'px';
  gunEl.style.top = mouseY + 'px';
  flashEl.style.left = (mouseX - 30) + 'px';
  flashEl.style.top = (mouseY + 5) + 'px';
});

function fireGun() {
  // Recoil
  gunEl.classList.remove('firing');
  void gunEl.offsetWidth;
  gunEl.classList.add('firing');
  // Muzzle flash
  flashEl.innerHTML = muzzleFlashSVG(selectedColor);
  flashEl.classList.add('show');
  setTimeout(() => flashEl.classList.remove('show'), 80);
}

// ── State ──
let score = 0;
let streak = 0;
let bestStreak = 0;
let kills = 0;
let queenKills = 0;
let streakTimer = null;
let selectedColor = PAINT_COLORS[0];
let busMarkers = {};
let splatMarkers = [];
let gameActive = false;
let timerInterval = null;
let timeLeft = 15;
updateGun();

// ── Map — light/satellite style that reads as pavement ──
const map = L.map('map', {
  center: [33.448, -112.074],
  zoom: 13,
  zoomControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

// ── Color picker ──
const pickerEl = document.getElementById('color-picker');
PAINT_COLORS.forEach(c => {
  const swatch = document.createElement('div');
  swatch.className = 'color-swatch' + (c === selectedColor ? ' active' : '');
  swatch.style.background = c;
  swatch.onclick = () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    selectedColor = c;
    updateGun();
  };
  pickerEl.appendChild(swatch);
});

// ── Ant SVG (static, performant) ──
function antSVG(isQueen) {
  const s = isQueen ? 1.4 : 1;
  const w = Math.round(48 * s);
  const h = Math.round(32 * s);

  return `<svg width="${w}" height="${h}" viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Shadow -->
    <ellipse cx="24" cy="28" rx="16" ry="3" fill="rgba(0,0,0,0.18)"/>

    <!-- Legs -->
    <g stroke="#1a1008" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M32,16 Q38,8 40,4"/>
      <path d="M32,16 Q38,24 40,28"/>
      <path d="M24,16 Q30,6 33,3"/>
      <path d="M24,16 Q30,26 33,29"/>
      <path d="M16,16 Q20,7 24,5"/>
      <path d="M16,16 Q20,25 24,27"/>
    </g>

    <!-- Abdomen -->
    <ellipse cx="36" cy="16" rx="9" ry="6.5" fill="#2c1a0a"/>
    <path d="M30,11 Q32,16 30,21" stroke="#1a1008" stroke-width="0.6" fill="none" opacity="0.5"/>
    <path d="M34,10.5 Q36,16 34,21.5" stroke="#1a1008" stroke-width="0.5" fill="none" opacity="0.3"/>

    <!-- Petiole -->
    <ellipse cx="26" cy="16" rx="2.5" ry="3" fill="#3d2410"/>

    <!-- Thorax -->
    <ellipse cx="20" cy="16" rx="6" ry="5" fill="#3d2410"/>

    <!-- Head -->
    <ellipse cx="11" cy="16" rx="5.5" ry="5" fill="#2c1a0a"/>

    <!-- Eyes -->
    <ellipse cx="8.5" cy="13.5" rx="1.5" ry="1.3" fill="#000" opacity="0.7"/>
    <ellipse cx="8.5" cy="18.5" rx="1.5" ry="1.3" fill="#000" opacity="0.7"/>
    <circle cx="8" cy="13" r="0.5" fill="#fff" opacity="0.4"/>
    <circle cx="8" cy="18" r="0.5" fill="#fff" opacity="0.4"/>

    <!-- Mandibles -->
    <path d="M6,14 Q3,12 2,14" stroke="#1a1008" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M6,18 Q3,20 2,18" stroke="#1a1008" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Antennae -->
    <path d="M9,12 Q6,6 2,4" stroke="#1a1008" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M9,20 Q6,26 2,28" stroke="#1a1008" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <circle cx="2" cy="4" r="1" fill="#3d2410"/>
    <circle cx="2" cy="28" r="1" fill="#3d2410"/>
  </svg>`;
}

function busIcon(route, speed, bearing) {
  const isRail = /^(MERC|VENU|MARS|JUPI|EART|STRN|NEPT|URAN|SATU)/i.test(route);
  const isQueen = isRail;
  const s = isQueen ? 1.4 : 1;
  const w = Math.round(48 * s);
  const h = Math.round(32 * s);
  const rot = typeof bearing === 'number' ? bearing - 90 : 0;
  return L.divIcon({
    className: '',
    iconSize: [w, h],
    iconAnchor: [w/2, h/2],
    html: `<div style="cursor:none; transform:rotate(${rot}deg);
      filter:drop-shadow(1px 2px 2px rgba(0,0,0,0.35));">${antSVG(isQueen)}</div>`
  });
}

// Inject animations
const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes screenShake {
    0% { transform: translate(0,0); }
    15% { transform: translate(-4px, 3px); }
    30% { transform: translate(3px, -4px); }
    45% { transform: translate(-3px, -2px); }
    60% { transform: translate(4px, 2px); }
    75% { transform: translate(-2px, 3px); }
    100% { transform: translate(0,0); }
  }
  @keyframes shockwave {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 0.7; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }
  @keyframes gutFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }
  @keyframes squishBounce {
    0% { transform: scale(1, 1); }
    15% { transform: scale(1.8, 0.2); }
    30% { transform: scale(0.9, 1.1); }
    45% { transform: scale(1.2, 0.5); }
    60% { transform: scale(0.95, 1.05); }
    100% { transform: scale(1, 1); }
  }
  @keyframes scoreFloat {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -10px) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50px) scale(0.8); opacity: 0; }
  }
  .screen-shake { animation: screenShake 0.25s ease-out; }
  .shockwave-ring {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid; pointer-events: none; z-index: 800;
    animation: shockwave 0.4s ease-out forwards;
  }
  .gut-particle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    pointer-events: none; z-index: 801;
    animation: gutFly 0.5s ease-out forwards;
  }
  .floating-score {
    position: absolute; pointer-events: none; z-index: 802;
    font-size: 22px; font-weight: 900; white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    animation: scoreFloat 0.8s ease-out forwards;
  }
`;
document.head.appendChild(styleSheet);

// ── Splat — gnarly squished bug stain ──
function splatSVG(color) {
  const parts = [];
  const rot = Math.random() * 360;
  // Big central smear
  parts.push(`<ellipse cx="40" cy="40" rx="${14+Math.random()*8}" ry="${10+Math.random()*6}" fill="${color}" opacity="0.8" transform="rotate(${rot} 40 40)"/>`);
  // Secondary smear at angle
  parts.push(`<ellipse cx="40" cy="40" rx="${8+Math.random()*6}" ry="${5+Math.random()*4}" fill="${color}" opacity="0.6" transform="rotate(${rot+70+Math.random()*40} 40 40)"/>`);
  // Splatter droplets radiating out
  const count = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.6;
    const dist = 14 + Math.random() * 20;
    const cx = 40 + Math.cos(angle) * dist;
    const cy = 40 + Math.sin(angle) * dist;
    const r = 1.5 + Math.random() * 4.5;
    parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="${0.4 + Math.random() * 0.5}"/>`);
  }
  // Streaky trails
  for (let i = 0; i < 4; i++) {
    const angle = Math.random() * Math.PI * 2;
    const len = 12 + Math.random() * 16;
    const x2 = 40 + Math.cos(angle) * len;
    const y2 = 40 + Math.sin(angle) * len;
    parts.push(`<line x1="40" y1="40" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${1+Math.random()*2.5}" opacity="0.35" stroke-linecap="round"/>`);
  }
  // Dark gut smear center
  parts.push(`<ellipse cx="40" cy="40" rx="5" ry="4" fill="rgba(30,15,5,0.5)" transform="rotate(${rot} 40 40)"/>`);
  // Tiny crushed body bits
  parts.push(`<ellipse cx="${38+Math.random()*4}" cy="${38+Math.random()*4}" rx="2" ry="1.5" fill="#1a0e05" opacity="0.4"/>`);
  return `<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

// ── Screen shake ──
function shakeScreen(intensity) {
  const mapEl = document.getElementById('map');
  mapEl.style.setProperty('--shake', `${intensity}px`);
  mapEl.classList.remove('screen-shake');
  void mapEl.offsetWidth; // force reflow
  mapEl.classList.add('screen-shake');
  setTimeout(() => mapEl.classList.remove('screen-shake'), 250);
}

// ── Flying gut particles ──
function spawnGuts(screenPos, color, count) {
  const container = document.getElementById('map');
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'gut-particle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 80;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const size = 4 + Math.random() * 8;
    particle.style.cssText = `
      left: ${screenPos.x}px; top: ${screenPos.y}px;
      width: ${size}px; height: ${size}px;
      background: ${color};
      --dx: ${dx}px; --dy: ${dy}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '30%'};
      box-shadow: 0 0 4px ${color};
    `;
    container.appendChild(particle);
    setTimeout(() => particle.remove(), 600);
  }
}

// ── Shockwave ring ──
function spawnShockwave(screenPos, color) {
  const ring = document.createElement('div');
  ring.className = 'shockwave-ring';
  ring.style.cssText = `
    left: ${screenPos.x}px; top: ${screenPos.y}px;
    border-color: ${color};
    box-shadow: 0 0 12px ${color}, inset 0 0 12px ${color};
  `;
  document.getElementById('map').appendChild(ring);
  setTimeout(() => ring.remove(), 500);
}

// ── Floating score (DOM-based, not popup) ──
function showFloatingScore(screenPos, pts, color) {
  const el = document.createElement('div');
  el.className = 'floating-score';
  el.style.cssText = `left: ${screenPos.x}px; top: ${screenPos.y}px; color: ${color};`;
  el.textContent = `+${pts}`;
  document.getElementById('map').appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ── Hit ant ──
function hitBus(vehicleId, latlng, route, speed) {
  if (!gameActive) return;
  const isRail = /^(MERC|VENU|MARS|JUPI|EART|STRN|NEPT|URAN|SATU)/i.test(route);
  let pts = 10;
  if (speed > 15) pts += 10;
  if (speed > 25) pts += 10;
  if (isRail) pts += 15;

  streak++;
  clearTimeout(streakTimer);
  streakTimer = setTimeout(() => { streak = 0; updateHUD(); }, 5000);

  if (streak > bestStreak) bestStreak = streak;
  if (streak > 1) pts = Math.round(pts * (1 + streak * 0.25));
  score += pts;
  kills++;
  if (isRail) queenKills++;
  updateHUD();

  if (streak >= 3) {
    showStreakPopup(streak);
    sndStreak(streak);
  }

  // Sound + gun
  sndShoot();
  setTimeout(() => {
    sndSplat();
    if (isRail) sndQueen();
  }, 40);
  fireGun();

  // Get screen position for effects
  const screenPos = map.latLngToContainerPoint(latlng);

  // 1) Screen shake — bigger for queens
  shakeScreen(isRail ? 6 : 3);

  // 2) Shockwave ring
  spawnShockwave(screenPos, selectedColor);

  // 3) Flying gut particles
  spawnGuts(screenPos, selectedColor, isRail ? 16 : 10);

  // 4) Dark goo particles too
  spawnGuts(screenPos, '#2c1a0a', 4);

  // 5) Floating score
  showFloatingScore(screenPos, pts, selectedColor);

  // 6) Splat stain on map
  const splatIcon = L.divIcon({
    className: 'splat-marker',
    iconSize: [80, 80],
    iconAnchor: [40, 40],
    html: splatSVG(selectedColor)
  });
  const splat = L.marker(latlng, { icon: splatIcon, interactive: false }).addTo(map);
  splatMarkers.push(splat);

  setTimeout(() => {
    splat.getElement()?.classList.add('fading');
    setTimeout(() => { map.removeLayer(splat); }, 2500);
  }, 10000);

  // 7) Squish-bounce the ant
  const busEntry = busMarkers[vehicleId];
  if (busEntry) {
    const el = busEntry.marker.getElement();
    if (el) {
      el.style.animation = 'squishBounce 0.4s ease-out';
      el.style.filter = 'brightness(0.5) saturate(0.3)';
      setTimeout(() => {
        el.style.animation = '';
        el.style.filter = '';
      }, 500);
    }
  }
}

function showStreakPopup(n) {
  const el = document.getElementById('streak-popup');
  const msgs = { 3: 'SQUISH COMBO!', 4: 'EXTERMINATOR!', 5: 'PESTICIDE!' };
  el.textContent = msgs[n] || `${n}x CARNAGE!`;
  el.style.color = selectedColor;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('streak').textContent = streak;
}

// ── Fetch + render ──
async function fetchBuses() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    const entities = data.entity || [];
    const activeBuses = {};

    entities.forEach(e => {
      const v = e.vehicle;
      if (!v || !v.trip || !v.position) return;
      const id = v.vehicle?.id || e.id;
      const lat = v.position.latitude;
      const lng = v.position.longitude;
      const route = v.trip.routeId || '?';
      const speed = (v.position.speed || 0) * 2.237;
      const bearing = v.position.bearing;
      activeBuses[id] = { lat, lng, route, speed, bearing };

      if (busMarkers[id]) {
        busMarkers[id].marker.setLatLng([lat, lng]);
        busMarkers[id].marker.setIcon(busIcon(route, speed, bearing));
        busMarkers[id].data = { route, speed };
      } else {
        const marker = L.marker([lat, lng], { icon: busIcon(route, speed, bearing) }).addTo(map);
        marker.on('click', (ev) => {
          hitBus(id, ev.latlng, busMarkers[id]?.data.route, busMarkers[id]?.data.speed);
        });
        const isRail = /^(MERC|VENU|MARS|JUPI|EART|STRN|NEPT|URAN|SATU)/i.test(route);
        marker.bindTooltip(isRail ? `Queen Ant (${route})` : `Ant #${route}`, {
          className: 'ant-tooltip', direction: 'top', offset: [0, -16]
        });
        busMarkers[id] = { marker, data: { route, speed } };
      }
    });

    Object.keys(busMarkers).forEach(id => {
      if (!activeBuses[id]) {
        map.removeLayer(busMarkers[id].marker);
        delete busMarkers[id];
      }
    });

    document.getElementById('bus-count').textContent = Object.keys(activeBuses).length;
  } catch (err) {
    console.error('Fetch error:', err);
  }
}

// ── Timer + Game flow ──
function sndTick() {
  playTone(800, 0.05, 'sine', 0.15);
}
function sndTimerWarn() {
  playTone(600, 0.1, 'square', 0.2, 300);
}
function sndGameOver() {
  playTone(300, 0.3, 'sawtooth', 0.3, 80);
  setTimeout(() => playTone(200, 0.4, 'sawtooth', 0.25, 50), 200);
  setTimeout(() => playTone(120, 0.5, 'sine', 0.3, 40), 450);
}

function startGame() {
  // Reset state
  score = 0; streak = 0; bestStreak = 0; kills = 0; queenKills = 0;
  timeLeft = 15;
  updateHUD();

  // Hide overlays, show HUD + timer
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('results-overlay').classList.remove('show-flex');
  document.getElementById('results-overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  const timerEl = document.getElementById('timer');
  timerEl.style.display = 'block';
  timerEl.textContent = '15';
  timerEl.classList.remove('urgent');

  gameActive = true;

  // Countdown
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;

    if (timeLeft <= 5) {
      timerEl.classList.add('urgent');
      sndTimerWarn();
    } else {
      sndTick();
    }

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function endGame() {
  gameActive = false;
  document.getElementById('timer').style.display = 'none';

  sndGameOver();

  // Fill results
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-kills').textContent = kills;
  document.getElementById('r-streak').textContent = bestStreak;
  document.getElementById('r-queens').textContent = queenKills;

  // Rank based on score
  let rank = '';
  if (score === 0) rank = 'The ants win this round.';
  else if (score < 50) rank = 'Rank: Barefoot Beginner';
  else if (score < 150) rank = 'Rank: Shoe Stomper';
  else if (score < 300) rank = 'Rank: Certified Pest Control';
  else if (score < 500) rank = 'Rank: The Exterminator';
  else rank = 'Rank: Ant Apocalypse';
  document.getElementById('r-rank').textContent = rank;

  // Show results
  const overlay = document.getElementById('results-overlay');
  overlay.style.display = 'flex';
  // Force reflow so the animation replays
  void overlay.offsetWidth;
  overlay.classList.add('show-flex');
}

// ── Pre-load buses so they're ready when the player starts ──
fetchBuses();
setInterval(fetchBuses, REFRESH_MS);
</script>
